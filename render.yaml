# Render blueprint: deploys the API, the ML service and a managed Postgres,
# entirely on Render's free tier.
#
# Create via Render → New → Blueprint, pointed at this repository.
#
# Free-tier caveats worth knowing before you rely on it:
#   * Free web services sleep after ~15 minutes idle; the next request pays a
#     ~50s cold start. The frontend surfaces this as a slow first load.
#   * Free Postgres expires 30 days after creation. Export and recreate, or move
#     to Supabase/Neon (both have a non-expiring free tier) and set DATABASE_URL
#     manually instead of using `fromDatabase` below.
#
# After the first deploy, set CORS_ORIGINS on `churnrate-api` to your Vercel URL
# — it is left blank here because the value depends on where you host it.
services:
  - type: web
    name: churnrate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: churnrate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # `hostport` resolves to "host:port" with no scheme. The API prefixes
      # http:// when one is missing, so this stays a valid URL either way.
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: churnrate-ml
          property: hostport
      # Set this to your deployed frontend origin, e.g.
      # https://churnrate.vercel.app — comma-separate multiple origins.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: churnrate-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: churnrate-db
    plan: free
    postgresMajorVersion: "16"
