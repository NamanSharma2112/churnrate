services:
  postgres:
    image: postgres:16-alpine
    container_name: churnrate-postgres
    environment:
      POSTGRES_USER: churnrate
      POSTGRES_PASSWORD: churnrate
      POSTGRES_DB: churnrate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnrate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: churnrate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnrate-backend
    environment:
      DATABASE_URL: postgresql://churnrate:churnrate@postgres:5432/churnrate?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret-change-in-production
      ENCRYPTION_KEY: docker-dev-encryption-key-change-in-production
      ML_SERVICE_URL: http://ml-service:8001
      CORS_ORIGINS: http://localhost:3000
      PORT: "3001"
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: churnrate-ml
    environment:
      DATABASE_URL: postgresql://churnrate:churnrate@postgres:5432/churnrate
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time: NEXT_PUBLIC_* values are inlined into the
        # client bundle, so setting them only at runtime has no effect.
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    container_name: churnrate-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
